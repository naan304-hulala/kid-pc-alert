name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish src/KidPcAlert/KidPcAlert.csproj -c Release -o out
      - name: Add install scripts
        shell: pwsh
        run: |
          Copy-Item install/* out/
          Remove-Item out/*.pdb -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: KidPcAlert
          path: out
